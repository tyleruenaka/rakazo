appId: com.rakazo.app
---
# Sign-in asks for an emailed code first when the server can send one; the password form sits
# behind "Use password". Wait for either form so the check runs after the server answers.
- extendedWaitUntil:
    visible: "Use password|Password"
    timeout: 15000
- runFlow:
    when:
      visible: "Use password"
    commands:
      - tapOn: "Use password"
